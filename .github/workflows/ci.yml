name: Mantis Build & Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Unzip into repo, consume zip, commit & push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name '*.zip' | sort)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No zip — using tree as-is"
          else
            for z in "${ZIPS[@]}"; do
              echo "EXTRACT $z"
              TMP=$(mktemp -d)
              unzip -o "$z" -d "$TMP"
              NDIR=$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | wc -l)
              NFILE=$(find "$TMP" -mindepth 1 -maxdepth 1 -type f | wc -l)
              TOP=$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -1 || true)
              if [ "$NDIR" -eq 1 ] && [ "$NFILE" -eq 0 ] && [ -n "$TOP" ]; then
                cp -a "$TOP"/. .
              else
                cp -a "$TMP"/. .
              fi
              rm -rf "$TMP"
              rm -f "$z"
            done
            git add -A
            if ! git diff --staged --quiet; then
              git commit -m "ci: extract payload into repo (consume zip) [skip ci]"
              git push origin HEAD:${{ github.ref_name }}
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Build Core2 + camera firmwares
        run: |
          set -euo pipefail
          pio run -e m5stack-core2
          pio run -e esp32cam-classic
          pio run -e esp32cam-s3
          echo "=== artifacts ==="
          ls -la .pio/build/m5stack-core2/*.bin || true
          ls -la .pio/build/esp32cam-classic/*.bin || true
          ls -la .pio/build/esp32cam-s3/*.bin || true
          ls -la firmware_merged.bin 2>/dev/null || true

      - name: Collect firmware for Pages
        run: |
          set -euo pipefail
          mkdir -p website/firmware
          merge_cam() {
            local env="$1" out="$2" chip="$3"
            local b=".pio/build/$env"
            local boot="$b/bootloader.bin" part="$b/partitions.bin" app="$b/firmware.bin"
            if [ ! -f "$app" ]; then echo "missing $app"; return 1; fi
            if [ -f "$boot" ] && [ -f "$part" ]; then
              if [ "$chip" = "esp32" ]; then
                esptool.py --chip esp32 merge_bin -o "$out" --flash_mode qio --flash_freq 80m --flash_size 4MB \
                  0x1000 "$boot" 0x8000 "$part" 0x10000 "$app" || cp -f "$app" "$out"
              else
                esptool.py --chip esp32s3 merge_bin -o "$out" --flash_mode qio --flash_freq 80m --flash_size 8MB \
                  0x0 "$boot" 0x8000 "$part" 0x10000 "$app" || cp -f "$app" "$out"
              fi
            else
              cp -f "$app" "$out"
            fi
          }
          if [ -f firmware_merged.bin ]; then
            cp -f firmware_merged.bin website/firmware/mantis-core2-merged.bin
          else
            cp -f .pio/build/m5stack-core2/firmware.bin website/firmware/mantis-core2-merged.bin
          fi
          merge_cam esp32cam-classic website/firmware/esp32cam-classic.bin esp32
          merge_cam esp32cam-s3 website/firmware/esp32cam-s3.bin esp32s3
          ls -la website/firmware/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
