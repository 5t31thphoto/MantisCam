name: Mantis Build & Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 1. Zip extractor — look for any .zip in repo root,
      #    extract with overwrite (add & replace), then continue.
      # ----------------------------------------------------------
      - name: Zip Extractor (add & replace)
        run: |
          set -e
          ZIPS=$(find . -maxdepth 1 -name '*.zip' -type f | head -5)
          if [ -z "$ZIPS" ]; then
            echo "No zip found in root — skipping extract."
          else
            for z in $ZIPS; do
              echo "Extracting $z (overwrite)…"
              unzip -o "$z" -d .
              echo "Contents after extract:"
              ls -la
            done
            # Optional: stage the extracted files so they become part of the tree
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --staged --quiet || git commit -m "ci: apply zip contents (add & replace)"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build Core2 firmware
        run: |
          pio run -e m5stack-core2
          ls -la .pio/build/m5stack-core2/ || true
          ls -la firmware_merged.bin || true

      - name: Collect artifacts
        run: |
          mkdir -p website/firmware
          # Prefer the merged binary produced by the post-script
          if [ -f firmware_merged.bin ]; then
            cp firmware_merged.bin website/firmware/mantis-core2-merged.bin
          else
            # Fallback: just the app binary
            cp .pio/build/m5stack-core2/firmware.bin website/firmware/mantis-core2-app.bin
            echo "WARNING: merged binary not found, using app binary only"
          fi
          # Also keep the raw app for advanced users
          cp .pio/build/m5stack-core2/firmware.bin website/firmware/mantis-core2-app.bin 2>/dev/null || true
          ls -la website/firmware/

      # Optional: build a minimal “fleet” ESP32-CAM binary if a
      # cam/ folder or platformio-cam.ini is present after zip extract
      - name: Build ESP32-CAM fleet image (if present)
        run: |
          if [ -f platformio-cam.ini ] || [ -d cam ]; then
            echo "CAM project detected — building…"
            # user can supply a cam/ sub-project via the zip
            if [ -d cam ]; then
              cd cam && pio run || true
              cp .pio/build/*/firmware.bin ../website/firmware/esp32cam-fleet.bin 2>/dev/null || true
            fi
          else
            echo "No CAM sub-project — website will offer a placeholder + instructions."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
