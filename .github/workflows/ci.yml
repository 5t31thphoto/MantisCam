name: Mantis Build & Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip extract (first)
        run: |
          set -euo pipefail
          ZIPS=$(find . -maxdepth 1 -name '*.zip' -type f | sort || true)
          if [ -z "${ZIPS}" ]; then
            echo "No zip in root — using checked-out tree."
          else
            for z in ${ZIPS}; do
              echo "Extracting $z (overwrite)…"
              TMP=$(mktemp -d)
              unzip -o "$z" -d "$TMP"
              NDIR=$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | wc -l)
              NFILE=$(find "$TMP" -mindepth 1 -maxdepth 1 -type f | wc -l)
              TOP=$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -1)
              if [ "$NDIR" -eq 1 ] && [ "$NFILE" -eq 0 ]; then
                cp -a "$TOP"/. .
              else
                cp -a "$TMP"/. .
              fi
              rm -rf "$TMP"
            done
          fi
          test -f platformio.ini || { echo "platformio.ini missing"; find . -maxdepth 3 -type f; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Build
        run: pio run -e m5stack-core2

      - name: Collect firmware
        run: |
          mkdir -p website/firmware
          if [ -f firmware_merged.bin ]; then
            cp firmware_merged.bin website/firmware/mantis-core2-merged.bin
          else
            cp .pio/build/m5stack-core2/firmware.bin website/firmware/mantis-core2-merged.bin
          fi
          cp .pio/build/m5stack-core2/firmware.bin website/firmware/mantis-core2-app.bin 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
