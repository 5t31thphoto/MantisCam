; MantisCam — Core2 companion + camera fleet firmware
[platformio]
default_envs = m5stack-core2

[env:m5stack-core2]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = default.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter =
    +<*>
    -<cam_classic/>
    -<cam_s3/>
lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.2
    bitbank2/JPEGDEC@^1.6.1
    bblanchon/ArduinoJson@^7.0.0
monitor_filters = esp32_exception_decoder
extra_scripts = post:merge_bin.py

; Classic ESP32-CAM family (AI-Thinker, ESP-EYE, WROVER, M5 cam, TTGO, …)
; Pin table auto-probes profiles from the Mantis manager.
[env:esp32cam-classic]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DFEATURE_CAMERA=1
    -DFEATURE_LED=1
    -DFEATURE_MDNS=0
    -DFEATURE_NAT=0
    -DFEATURE_OTA=0
    -DFEATURE_MOTION=0
build_src_filter =
    -<main.cpp>
    -<cam_s3/>
    +<cam_classic/>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; ESP32-S3 cameras — primary target XIAO ESP32S3 Sense (+ other S3 profiles in probe table)
[env:esp32cam-s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DFEATURE_CAMERA=1
    -DFEATURE_LED=1
    -DFEATURE_MDNS=0
    -DFEATURE_NAT=0
    -DFEATURE_OTA=0
    -DFEATURE_MOTION=0
build_src_filter =
    -<main.cpp>
    -<cam_classic/>
    +<cam_s3/>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
