; MantisCam — Core2 companion + camera fleet firmware
[platformio]
default_envs = m5stack-core2

[env:m5stack-core2]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = default.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter =
    +<*>
    -<cam/>
lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.2
    bitbank2/JPEGDEC@^1.6.1
    bblanchon/ArduinoJson@^7.0.0
monitor_filters = esp32_exception_decoder
extra_scripts = post:merge_bin.py

; ---------------------------------------------------------------------------
; Camera firmware: ONE env PER BOARD. Pins are fixed at compile time by the
; -DCAM_<ID> flag (see src/cam/main.cpp); a board built for the wrong chip
; fails to compile. The web flasher installs firmware/cam-<id>.bin for the
; board you pick. Env names must stay "cam-<id>" (CI + flasher rely on it).
;
; All camera images use partitions/mantis_cam.csv, whose "mcfg" slot at
; 0x310000 receives the settings typed into the web flasher. Flash header is
; 4MB on purpose: boots on 4/8/16 MB parts (a header LARGER than the real chip
; is a fatal boot error; smaller is just a warning).
; ---------------------------------------------------------------------------
[cam_common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = partitions/mantis_cam.csv
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
build_src_filter =
    -<*>
    +<cam/>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
cam_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DFEATURE_CAMERA=1
    -DFEATURE_LED=1
    -DFEATURE_MDNS=0
    -DFEATURE_NAT=0
    -DFEATURE_OTA=0
    -DFEATURE_MOTION=0

; Classic ESP32 boards. DIO flash mode boots on every ESP32-CAM clone.
[cam_classic]
extends = cam_common
board = esp32cam
board_build.flash_mode = dio

; ESP32-S3 boards: quad flash + octal PSRAM (N8R8 / N16R8 modules).
[cam_s3]
extends = cam_common
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
; boards whose only USB port is the chip's native USB: send the log there
native_usb_log = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; XIAO ESP32S3 Sense. Its board definition already routes Serial to the USB-C
; port. Never add ARDUINO_USB_CDC_ON_BOOT=0 here: the log then goes to
; GPIO43/44 and the XIAO looks dead.
[env:cam-xiao_s3]
extends = cam_s3
board = seeed_xiao_esp32s3
build_flags = ${cam_common.cam_flags} -DCAM_XIAO_S3

[env:cam-s3_eye]
extends = cam_s3
build_flags = ${cam_common.cam_flags} -DCAM_S3_EYE ${cam_s3.native_usb_log}

[env:cam-nulllab_s3]
extends = cam_s3
build_flags = ${cam_common.cam_flags} -DCAM_NULLLAB_S3

[env:cam-firebeetle_s3]
extends = cam_s3
build_flags = ${cam_common.cam_flags} -DCAM_FIREBEETLE_S3 ${cam_s3.native_usb_log}

[env:cam-dfr_aicam_s3]
extends = cam_s3
build_flags = ${cam_common.cam_flags} -DCAM_DFR_AICAM_S3 ${cam_s3.native_usb_log}

[env:cam-s3_cam_lcd]
extends = cam_s3
build_flags = ${cam_common.cam_flags} -DCAM_S3_CAM_LCD

[env:cam-ai_thinker]
extends = cam_classic
build_flags = ${cam_common.cam_flags} -DCAM_AI_THINKER

[env:cam-esp_eye]
extends = cam_classic
build_flags = ${cam_common.cam_flags} -DCAM_ESP_EYE

[env:cam-wrover_kit]
extends = cam_classic
build_flags = ${cam_common.cam_flags} -DCAM_WROVER_KIT

[env:cam-m5_psram]
extends = cam_classic
build_flags = ${cam_common.cam_flags} -DCAM_M5_PSRAM

[env:cam-m5_v2]
extends = cam_classic
build_flags = ${cam_common.cam_flags} -DCAM_M5_V2

[env:cam-m5_wide]
extends = cam_classic
build_flags = ${cam_common.cam_flags} -DCAM_M5_WIDE

[env:cam-m5_nopsram]
extends = cam_classic
build_flags = ${cam_common.cam_flags} -DCAM_M5_NOPSRAM

[env:cam-ttgo_tjournal]
extends = cam_classic
build_flags = ${cam_common.cam_flags} -DCAM_TTGO_TJOURNAL
